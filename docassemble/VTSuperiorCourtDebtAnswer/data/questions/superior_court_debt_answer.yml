id: is plaintiff a third-party debt collector
question: |
  % if len(other_parties) > 1:
  Are plaintiffs a third-party debt collector?
  % else:
  Is ${ other_parties[0] } a third-party debt collector?
  % endif
subquestion: |
  We ask this question because it may affect what you might ask for in a counterclaim.
  
  A third-party debt collector generally is a person or a company that regularly collects debts owed to others, usually when those debts are past-due. They are **not** the [original creditor.](https://library.nclc.org/book/fair-debt-collection/133-original-creditors)

  Third-party debt collectors include collection agencies or lawyers who collect debts as part of their business. There are also companies that buy past-due debts from creditors or other businesses and then try to collect them. These third-party debt collectors are also called debt collection agencies, debt collection companies or debt buyers.
  
fields:
  - Are any of the plaintiffs a **third-party debt collector**?: sued_by_collection_agency
    input type: radio
    choices:
      - Yes: True
      - No: False
      - I don't know: None
