id: combining individual counterclaim selections and the self-typed explanation
depends on:
  - sued_by_collection_agency
  - counterclaims
  - counterclaims_description
code: |
    merged_counterclaims_text = ""

    if sued_by_collection_agency:
      for item in counterclaims.true_values():
        merged_counterclaims_text += counterclaims_terms[item] + "\n"

    if defined("counterclaims_description") and counterclaims_description.strip():
      merged_counterclaims_text += counterclaims_description

    if defined("wants_to_file_counterclaim") and not wants_to_file_counterclaim:
      merged_counterclaims_text = ""
    
    if defined("no_counterclaims") and no_counterclaims:
      merged_counterclaims_text = ""
