id: enable counterclaim doc or not
code: |
  if defined("wants_to_file_counterclaim"):
    if wants_to_file_counterclaim:
      superior_court_debt_counterclaim_attachment.enabled = True
    else:
      superior_court_debt_counterclaim_attachment.enabled = False
  
