metadata:
  title: Superior Court debt answer
  short title: Superior Court debt answer
  description: >-
    Respond to a debt collection Complaint filed in the Civil Division of Vermont Superior Court.
  can_I_use_this_form: |
    Use this tool if you received a Complaint about a debt in the Civil Division of Vermont Superior Court, and your Summons says you have 21 days to answer.
  before_you_start: |
    Have the Complaint and Summons with you. You will need the names of the parties, the court and county, the case number if there is one, and the numbered paragraphs in the Complaint.
  maturity: development
  estimated_completion_minutes: 30
  estimated_completion_delta: 10
  LIST_topics: 
    - "MO-12-01-09-00"
  tags:
    - "MO-12-01-09-00"
  authors:
    - K. Surette, VTCourtForms / Legal Services Vermont
    - K. McGuire, Lemma Legal
  original_form:
  original_form_published_on:
  help_page_url: https://vtlawhelp.org/defend-yourself-court
  help_page_title: Defend yourself in court against debt collection
  allowed_courts: []
  typical_role: "defendant"
  languages:
    - en
  jurisdiction: NAM-US-US+VT
  review_date: 2026-08-10
  form_titles:
    - Answer
    - Counterclaim
    - Notice of Appearance
    - Certificate of Service
    - Disclosure of Exempt Income
    - Financial Disclosure Affidavit
    - Application to Waive Filing Fees and Service Costs
  form_numbers:
  update_notes: |
---
