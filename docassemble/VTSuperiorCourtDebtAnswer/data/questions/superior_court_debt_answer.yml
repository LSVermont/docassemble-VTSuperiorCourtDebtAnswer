id: counterclaims intro
question: |
  Counterclaim
subquestion: |
  This part of the tool can help you figure out if you have a “counterclaim” against ${ other_parties.short_list(2) }.

  A counterclaim is a lawsuit the defendant files against the plaintiff in the original case. Many people do not have a counterclaim. 
  
  If you decide to file a counterclaim, you are asking the court to award YOU money. When you ask for money in a counterclaim, you are asking for "damages." 
  
  There is a fee to file a counterclaim. As part of your counterclaim, you can ask to be reimbursed for your court filing fee. If you get public assistance or have a very low income, you can ask to waive the filing fee.
  
  You may want to talk to a lawyer if you are thinking about making a counterclaim. This is because there are some [laws that only apply to how debt collectors do business.](https://files.consumerfinance.gov/f/documents/cfpb_fair-debt-collection-practices-act-fdcpa-procedures_2022-12.pdf) And for all kinds of plaintiffs, you need to have proof that you suffered real damages.
  
  **Counterclaim filing fee**
  
  - The fee is $90.
  - If you have a low income or get public assistance, you can ask the court to waive the fee.

  Tap Next for the next screen.
  
continue button field: counterclaims_intro
---
id: counterclaim debt collector
question: |
  % if len(other_parties) > 1:
  Do you want to make a counterclaim against the third-party debt collectors?
  % else:
  Do you want to make a counterclaim against the third-party debt collector ${ other_parties[0] }?
  % endif
subquestion: |
  Below is a list of some counterclaims that might apply to third-party debt collectors because of a law called the [Fair Debt Collection Practices Act (FDCPA).](https://files.consumerfinance.gov/f/documents/cfpb_fair-debt-collection-practices-act-fdcpa-procedures_2022-12.pdf) These only apply to third-party debt collectors.

  To be successful with a counterclaim, you would need to prove your claim to the court. Learn more about counterclaims on [NCLC’s Surviving Debt website.](https://library.nclc.org/book/surviving-debt/common-counterclaims-raise)

  If you make a selection below, you can write more about the situation on the next screen.
fields:
  - Check any box that describes your situation, or check None: counterclaims
    datatype: checkboxes
    choices:
      - "The plaintiffs are not the original creditor or lender of the money, and I didn't get a letter from them alerting me to my debt before I was sued.": no_notice
      - "The plaintiffs are not the original creditor or lender of the money, and they made statements that were not true or were misleading about the debt.": false_statements
      - "The plaintiffs are not the original creditor or lender of the money, and they harassed me and they violated the Fair Debt Collection Practices Act (FDCPA).": harassment
      - "The plaintiffs **owe me money for another reason**. (Tip: You can explain on the next screen.": plaintiff_owes_me_other_reason
  - note: |
      Notes about the FDCPA law:
      
      - The FDCPA applies only to third-party debt collectors, so one element of an FDCPA violation claim is to state that the debt collector is **not** the original creditor. However, this alone does not provide grounds for an FDCPA counterclaim.

      - You may successfully claim harassment in a case like this if the plaintiff's behavior was **beyond** annoying. For example, they called you at late hours of the night or early morning, they used swear words, or they called you more than two times each day. Those are harassing behaviors.

      - About getting notified by a debt collector: A debt collector is not required to tell you that they plan to file a lawsuit, but before they sue you, they need to have told you about your debt. (Source: [FTC website](https://www.ftc.gov/legal-library/browse/rules/fair-debt-collection-practices-act-text#809))
