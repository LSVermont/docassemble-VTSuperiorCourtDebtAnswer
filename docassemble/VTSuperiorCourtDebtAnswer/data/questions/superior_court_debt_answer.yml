  ${ action_button_html(url_action('review_superior_court_debt_answer'), label='<i class="fa-solid fa-pencil"></i> Edit your answers', color='info') }

  **Remember to come back to this window to continue and sign your form.**

  Before you sign or download, remember:

  - You must file this answer with the Court **and** send a copy of the answer and attachments to every party in the case.
  - You must file and send a Certificate of Service showing that you sent the documents.
  - Anything else you file with the Court must also be sent to every party, with a Certificate of Service.
  - You must follow the Vermont Rules of Civil Procedure.
  - You agree that papers in this case may be sent to you at the address you provided.
