############ Interview order ############
id: interview order superior court debt answer
code: |
  user_role = "defendant"
  user_ask_role = "defendant"
  user_has_attorney = False
  trial_court_division = "Civil"
  court_division = "Civil"
  division_requires_county = True

  nav.set_section('intro')
  got_debt_complaint
  if not got_debt_complaint:
    wrong_interview_kickout
  elif small_claims_complaint:
    wrong_interview_kickout
  plaintiff_requests_nonmoney
  if plaintiff_requests_nonmoney:
    wrong_interview_kickout
  summons_response_days
  if summons_response_days != "21":
    wrong_interview_kickout
  has_docket_number
  if has_docket_number and not docket_number_has_cv:
    wrong_interview_kickout
  if not has_docket_number:
    docket_number = ""
  date_received
  if date_received <= today().minus(days=21):
    late_answer_warning
  else:
    you_can_use_this_tool
  lets_get_started

  nav.set_section('about_you')
  users.gather()
  users[0].address.address
  users[0].phone_number
  users[0].email
  set_progress(18)

  nav.set_section('case_info')
  user_selected_county
  trial_court.address.county
  set_progress(28)

  nav.set_section('other_party')
  other_parties.gather()
  set_progress(36)

  nav.set_section('complaint')
  number_of_complaint_paragraphs
  for i in range(number_of_complaint_paragraphs):
    allegation_answers[i].complete
  set_progress(52)

  nav.set_section('any_defenses')
  defenses
  if len(defenses.true_values()) > 0:
    disagrees_additional_explanation
  else:
    no_defenses_check
    agreeing_with_complaint_and_payments
  set_progress(62)

  nav.set_section('counterclaims')
  counterclaims_intro
  if sued_by_collection_agency:
    if len(counterclaims.true_values()) == 0:
      if wants_to_file_counterclaim:
        counterclaims_amount
      else:
        no_counterclaims
  else:
    if wants_to_file_counterclaim:
      counterclaims_amount
    else:
      no_counterclaims
  
  if wants_to_file_counterclaim:
    wants_counterclaim_other_relief
    if wants_counterclaim_other_relief:
      counterclaim_reliefs.gather()
    else:
      counterclaim_reliefs.there_are_any = False

    wants_to_fill_out_fee_waiver_now
    if wants_to_fill_out_fee_waiver_now:
      interview_order_VT_fee_waiver
  else:
    wants_to_file_counterclaim = False
  set_progress(72)

  nav.set_section('exempt_income')
  has_exempt_income_state

  if len(has_exempt_income_state.true_values()) == 0 and len(has_exempt_income_other.true_values()) == 0:
    if living_expenses_more_than_income:
      if wants_financial_disclosure_affidavit:
        interview_order_financial_disclosure
    else:
      otherwise_exempt
  set_progress(82)

  nav.set_section('other_relief')
  wants_other_relief_choices
  if wants_other_relief_choices['other_relief']:
    other_reliefs.gather()

  nav.set_section('notice_of_appearance')
  notice_of_appearance_transition
  interview_order_a_civil_notice_of_appearance_self_rep

  nav.set_section('certificate_of_service')
  certificate_of_service_transition
  certificate_of_service_prechecked_documents
  interview_order_general_certificate_of_service

  # make sure these variables are defined for the Answer and Counterclaim preview/download
  any_allegation_disputed
  merged_counterclaims_text
  
  superior_court_debt_answer_interview_order = True
---
mandatory: True
id: main order superior court debt answer
code: |
  al_intro_screen
  superior_court_debt_answer_interview_order
  nav.set_section("review_superior_court_debt_answer")
  superior_court_debt_answer_preview_question
  nav.set_section("sign")
  signature_date
  al_form_requires_digital_signature = False
  basic_questions_signature_flow
  nav.set_section("get_docs")
  superior_court_debt_answer_download
