      % endif

      % if showifdef('docket_number_has_cv') == False:
      Does the Complaint say it is a **Small Claims Complaint**?: ${ word(yesno(complaint_says_small_claims)) if defined('complaint_says_small_claims') else '' }
      % endif

      % if showifdef('docket_number_has_cv'):
      What is the case number?: ${ showifdef('docket_number') }
      % endif
  - Edit: date_received
    button: |
      **When did you receive the Complaint?**

      Date recieved:: ${ showifdef('date_received') }
  - Edit: acknowledged_information_use
    button: |
      **Getting started**

      To continue, please accept our [terms of use](https://vtlawhelp.org/vtcourtforms/terms-of-use).: ${ showifdef('acknowledged_information_use') }
  - Edit: users.there_is_another
    button: |
      **Are there any other ${ user_role }s named in the case?**

      ${ word(yesno(users.there_is_another)) if defined('users.there_is_another') else '' }
  - Edit: users[0].address.address
    button: |
      **What is your address?**

      Address: ${ users[0].address.block() if defined('users[0].address.address') else '' }

      I have a mailing address that is different from my street address: ${ word(yesno(users1_mailing_address_different)) if defined('users1_mailing_address_different') else '' }

      % if showifdef('users1_mailing_address_different'):
      Mailing address: ${ showifdef('users[0].mailing_address.address') }
      % endif

      % if showifdef('users1_mailing_address_different'):
      Unit: ${ showifdef('users[0].mailing_address.unit') }
      % endif

      % if showifdef('users1_mailing_address_different'):
      City: ${ showifdef('users[0].mailing_address.city') }
      % endif

      % if showifdef('users1_mailing_address_different'):
      Zip or postal code: ${ showifdef('users[0].mailing_address.zip') }
      % endif
  - Edit: users[0].phone_number
    button: |
      **Phone and email**

      Your home or cell phone number: ${ showifdef('users[0].phone_number') }

      Your work phone or other number: ${ showifdef('users[0].work_phone_number') }

      Your email address: ${ showifdef('users[0].email') }
  - Edit: other_parties.there_is_another
    button: |
      **Is there another plaintiff in this case?**

      ${ word(yesno(other_parties.there_is_another)) if defined('other_parties.there_is_another') else '' }
  - Edit: number_of_complaint_paragraphs
    button: |
      **How many numbered paragraphs are in the Complaint?**

      Number of numbered paragraphs: ${ showifdef('number_of_complaint_paragraphs') }

  
  - Edit: defenses
    button: |
      **Any reasons why you believe you do **not** owe this money?**

      Check any boxes that describe your situation, or check None: ${ showifdef('defenses') }
  - Edit: disagrees_additional_explanation
    button: |
      **Do you want to add any more details?**

      More explanation: ${ showifdef('disagrees_additional_explanation') }
  - Edit: disagrees_additional_explanation
    button: |
      **Do you want to add any more details?**

      More explanation (optional): ${ showifdef('disagrees_additional_explanation') }
  - Edit: counterclaims
    button: |
      <strong>
      % if len(other_parties) > 1:
      Do you want to make a counterclaim against the third-party debt collectors?
      % else:
      Do you want to make a counterclaim against the third-party debt collector ${ other_parties[0] }?
      % endif
      </strong>

      Check any box that describes your situation, or check None: ${ showifdef('counterclaims') }
  - Edit:
      - wants_to_file_counterclaim
      - follow up:
        - counterclaims_amount
      - recompute:
        - superior_court_debt_counterclaim_attachment.enabled
    button: |
      **Do you want to make a counterclaim?**

      Do you want to file a counterclaim against ${ other_parties.short_list(2) }?: ${ word(yesno(wants_to_file_counterclaim)) if defined('wants_to_file_counterclaim') else '' }
  - Edit: sued_by_collection_agency
    button: |
      <strong>
      % if len(other_parties) > 1:
      Are plaintiffs a third-party debt collector?
      % else:
      Is ${ other_parties[0] } a third-party debt collector?
      % endif
      </strong>

      Are any of the plaintiffs a **third-party debt collector**?: ${ showifdef('sued_by_collection_agency') }
  - Edit: counterclaims_amount
    button: |
      **Counterclaim details**

      I want to ask the court for this amount of money in my counterclaim: ${ currency(counterclaims_amount) if defined('counterclaims_amount') else '' }

      Describe the reason(s) for your counterclaim against ${ other_parties.short_list(2) }. Be specific.: ${ showifdef('counterclaims_description') }
  - Edit: wants_counterclaim_other_relief
    button: |
      **Do you want to ask for any other relief on your counterclaim?**

      ${ word(yesno(wants_counterclaim_other_relief)) if defined('wants_counterclaim_other_relief') else '' }
  - Edit: counterclaim_reliefs.there_is_another
    button: |
      **Do you want to add another request for relief on your counterclaim?**

      ${ word(yesno(counterclaim_reliefs.there_is_another)) if defined('counterclaim_reliefs.there_is_another') else '' }
  - Edit: wants_to_fill_out_fee_waiver_now
    button: |
      **Would you like to fill out a fee waiver?**

      Do you want to fill out a fee waiver form for your counterclaim?: ${ word(yesno(wants_to_fill_out_fee_waiver_now)) if defined('wants_to_fill_out_fee_waiver_now') else '' }
  - Edit: has_exempt_income_state
    button: |
      **Do you have "exempt" income?**

      ${ showifdef('has_exempt_income_state') }

      ${ showifdef('has_exempt_income_other') }
  - Edit: living_expenses_more_than_income
    button: |
      **Are your living expenses more than your income?**

      Are the reasonable living expenses for you and your dependents, such as family members who live with you, **more than your income after taxes**?: ${ word(yesno(living_expenses_more_than_income)) if defined('living_expenses_more_than_income') else '' }
  - Edit: wants_financial_disclosure_affidavit
    button: |
      **Financial Disclosure Affidavit**

      Do you want to fill out a Financial Disclosure Affidavit form?: ${ word(yesno(wants_financial_disclosure_affidavit)) if defined('wants_financial_disclosure_affidavit') else '' }
  - Edit: otherwise_exempt
    button: |
      **Is there another reason your income may be exempt?**

      Other reason: ${ showifdef('otherwise_exempt') }
  - Edit: wants_other_relief_choices
    button: |
      **Do you want to ask the court for anything else?**

      Select an option: ${ showifdef('wants_other_relief_choices') }
  - Edit: other_reliefs.there_is_another
    button: |
      **Do you want to add another request?**

      ${ word(yesno(other_reliefs.there_is_another)) if defined('other_reliefs.there_is_another') else '' }
  - Edit: printed_signature
    button: |
      **Signature date**

      This is how your name will appear under your signature.: ${ showifdef('printed_signature') }
  - Edit: user.signature
    button: |
      **Sign your forms**

      Sign your forms
      : ${ showifdef('user.signature') }
