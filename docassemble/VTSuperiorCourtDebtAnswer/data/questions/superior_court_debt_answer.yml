objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[superior_court_debt_next_steps, superior_court_debt_answer_attachment, superior_court_debt_counterclaim_attachment, a_civil_notice_of_appearance_self_rep_attachment, disclosure_of_exempt_income_attachment, financial_disclosure_attachment, VT_fee_waiver_attachment, certificate_of_service_attachment], filename="superior_court_debt_answer", title="All forms to download", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[superior_court_debt_answer_attachment, superior_court_debt_counterclaim_attachment, a_civil_notice_of_appearance_self_rep_attachment, disclosure_of_exempt_income_attachment, financial_disclosure_attachment, VT_fee_waiver_attachment, certificate_of_service_attachment], filename="superior_court_debt_answer", title="All forms to deliver to court", enabled=True)
